name: Publish Wiki Copilot images

# Keep this workflow, quality checks, and dependency audit enabled.
# Disable the other upstream workflows in repository Actions settings.
on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v1.0.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PYTHONPATH: ./backend
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: password
      LICENSE_ENFORCEMENT_ENABLED: "false"
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.25"
          python-version: "3.13"
          enable-cache: false
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Check Python types
        run: uv run --no-sync ty check --output-format github
      - name: Test project backend
        run: uv run --no-sync pytest --rootdir=. -c backend/pytest.ini
      - name: Apply database migrations
        working-directory: ./backend
        env:
          PYTHONPATH: .
        run: uv run --no-sync alembic upgrade head
      - name: Test Wiki.js access and SSO storage
        run: |
          uv run --no-sync pytest \
            backend/tests/external_dependency_unit/db/test_wikijs_document_access.py \
            backend/tests/external_dependency_unit/db/test_sso_provider_store.py

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
          no-cache: true
      - name: Test frontend
        working-directory: ./web
        run: |
          bun install --frozen-lockfile
          bun run test:ci

  publish:
    needs: [test-backend, test-web]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: onyx-backend
            context: ./backend
            target: runtime
          - image: onyx-web-server
            context: ./web
            target: runner
    steps:
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v1\.0\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/liliumstargazer/${{ matrix.image }}
          tags: |
            type=raw,value=wiki-js-${{ github.sha }}
            type=match,pattern=^v(1\.0\.[0-9]+)$,group=1
            type=match,pattern=^v(1\.0)\.[0-9]+$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v1.0.') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

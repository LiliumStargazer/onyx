name: Dependency Audit

concurrency:
  group: audit-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "web/**/package.json"
      - "web/bun.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "backend/requirements/*.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "tools/*.py"
      - "tools/ods/**"
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 10 * * 0"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.25"
          enable-cache: false
      - name: Install locked audit tools
        run: uv sync --frozen --no-install-project --only-group ods
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/ods/go.mod
          cache: false
      - name: Test and build the repository audit scanner
        working-directory: tools/ods
        run: |
          go test -mod=readonly ./internal/audit ./internal/auditcmd
          go build -mod=readonly -o "$RUNNER_TEMP/ods-audit" ./odsaudit
      - name: Scan dependencies and Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: LiliumStargazer/wiki-copilot
        run: |
          dependencies_status=0
          actions_status=0
          "$RUNNER_TEMP/ods-audit" --python --web --lockfile tools/ods/go.mod --ignore-url '' --format=json > dependencies.raw.json 2> dependencies.raw.log || dependencies_status=$?
          "$RUNNER_TEMP/ods-audit" --actions \
            --workflow .github/workflows/audit.yml \
            --workflow .github/workflows/pr-quality-checks.yml \
            --workflow .github/workflows/publish-wikijs-images.yml \
            --ignore-url '' --format=json > actions.raw.json 2> actions.raw.log || actions_status=$?
          if (( dependencies_status > 1 || actions_status > 1 )); then
            exit 1
          fi
          uv run --no-sync python tools/wiki_copilot_security.py filter audit.json dependencies.raw.json actions.raw.json > audit.md
      - name: Publish scoped summary
        if: always()
        run: |
          if [[ -f audit.md ]]; then cat audit.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit.json
            audit.md
            dependencies.raw.json
            actions.raw.json
            dependencies.raw.log
            actions.raw.log
          retention-days: 14

  sync-dependabot:
    if: github.workflow == 'Dependency Audit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.25"
          enable-cache: false
      - run: uv sync --frozen --no-install-project --only-group ods
      - name: Synchronize native alerts with the active scope
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          GH_REPO: LiliumStargazer/wiki-copilot
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::warning::Set DEPENDABOT_ALERTS_TOKEN to filter native Dependabot alerts.'
            exit 1
          fi
          uv run --no-sync python tools/wiki_copilot_security.py sync-dependabot

  deployed-images:
    if: github.workflow == 'Dependency Audit' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List active deployment images without starting services
        id: images
        env:
          IMAGE_TAG: ${{ vars.DEPLOYED_IMAGE_TAG }}
          POSTGRES_PASSWORD: not-used-for-rendering
          USER_AUTH_SECRET: not-used-for-rendering
          WEB_DOMAIN: https://example.invalid
          OPENSEARCH_ADMIN_PASSWORD: not-used-for-rendering
        run: |
          : "${IMAGE_TAG:?Set DEPLOYED_IMAGE_TAG to the version running in Portainer}"
          docker compose -f deployment/docker_compose/docker-compose.yml -f deployment/docker_compose/docker-compose.portainer-wikijs.yml config --format=json > compose.json
          images=$(jq -c '[.services[] | select(((.profiles // []) | length) == 0) | .image] | unique' compose.json)
          echo "images=$images" >> "$GITHUB_OUTPUT"

  image-audit:
    if: needs.deployed-images.result == 'success'
    needs: deployed-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.deployed-images.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/ods/go.mod
          cache: false
      - name: Build the repository audit scanner
        working-directory: tools/ods
        run: go build -mod=readonly -o "$RUNNER_TEMP/ods-audit" ./odsaudit
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit a deployed image
        env:
          AUDIT_IMAGE: ${{ matrix.image }}
        run: |
          "$RUNNER_TEMP/ods-audit" image "$AUDIT_IMAGE" --ignore-url '' --format=json,text > image-audit.json
      - name: Save image report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: image-audit-${{ strategy.job-index }}
          path: image-audit.json
          retention-days: 14

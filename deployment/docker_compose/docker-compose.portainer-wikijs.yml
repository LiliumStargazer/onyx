# Portainer Git stack: add this file after docker-compose.yml.
# Caddy serves public HTTPS; do not sync the real Wiki until access checks pass.
services:
  api_server:
    image: ghcr.io/liliumstargazer/onyx-backend:${IMAGE_TAG:?Set IMAGE_TAG in Portainer}
    build: !reset null
    environment:
      FILE_STORE_BACKEND: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:?Set USER_AUTH_SECRET in Portainer}
      WEB_DOMAIN: https://am-copilot.duckdns.org
  background:
    image: ghcr.io/liliumstargazer/onyx-backend:${IMAGE_TAG:?Set IMAGE_TAG in Portainer}
    build: !reset null
    environment:
      FILE_STORE_BACKEND: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:?Set USER_AUTH_SECRET in Portainer}
      WEB_DOMAIN: https://am-copilot.duckdns.org
  web_server:
    image: ghcr.io/liliumstargazer/onyx-web-server:${IMAGE_TAG:?Set IMAGE_TAG in Portainer}
    build: !reset null
    environment:
      WEB_DOMAIN: https://am-copilot.duckdns.org
  inference_model_server:
    image: onyxdotapp/onyx-model-server:nightly-latest-20260926
    build: !reset null
  indexing_model_server:
    image: onyxdotapp/onyx-model-server:nightly-latest-20260926
    build: !reset null
  relational_db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
  opensearch:
    environment:
      # OpenSearch requires upper/lowercase letters, a digit, and a symbol.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?Set OPENSEARCH_ADMIN_PASSWORD in Portainer}
      # ponytail: 1 GiB heap for the 8 GiB trial host; restore 2 GiB on a larger host.
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
  nginx:
    ports: !override []
    volumes:
      - /opt/onyx/nginx:/nginx-templates:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: am-copilot.duckdns.org
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s {\n  reverse_proxy nginx:80\n}\n' "$$DOMAIN" > /etc/caddy/Caddyfile
        && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

volumes:
  caddy_data:
  caddy_config:
